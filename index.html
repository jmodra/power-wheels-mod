<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Power Wheels Control Panel</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-muted: #8b949e;
      --accent: #ff8a3d;
      --red: #e63946;
      --amber: #f59e0b;
      --green: #10b981;
      --purple: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 16px; }

    .container { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 16px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; align-items: center; }

    /* Status Bar */
    .status-bar { display: flex; justify-content: space-between; align-items: center; width: 100%; font-size: 14px; font-weight: 600; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--red); display: inline-block; margin-right: 6px; }
    .dot.connected { background: var(--green); box-shadow: 0 0 8px var(--green); }

    /* Buttons */
    .btn { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 12px 20px; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: center; width: 100%; transition: all 0.1s ease; }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background: #238636; border-color: #2ea043; color: #fff; }
    .btn-primary.active { background: #da3633; border-color: #f85149; }
    .btn-stop { background: #da3633; border-color: #f85149; color: #fff; font-size: 18px; padding: 16px; }
    
    .hold-btn { background: #21262d; border: 2px solid var(--border); color: var(--text); padding: 16px; border-radius: 8px; font-size: 16px; font-weight: 700; width: 100%; text-align: center; touch-action: manipulation; }
    .hold-btn.engaged { background: var(--accent); color: #000; border-color: var(--accent); }
    .hold-btn.drift-mode.engaged { background: var(--purple); color: #000; border-color: var(--purple); }

    /* Gauge */
    .gauge-container { position: relative; width: 100%; max-width: 320px; height: 200px; display: flex; justify-content: center; }
    svg { width: 100%; height: 100%; overflow: visible; }
    .gauge-readout { position: absolute; bottom: 10px; text-align: center; }
    .gauge-val { font-size: 42px; font-weight: 800; color: #fff; line-height: 1; }
    .gauge-val.turbo { color: var(--red); }
    .gauge-val.drift { color: var(--purple); }
    .gauge-sub { font-size: 14px; color: var(--text-muted); margin-top: 4px; }

    /* Battery Bar */
    .batt-container { width: 100%; }
    .batt-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 6px; }
    .batt-track { width: 100%; height: 12px; background: #21262d; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .batt-fill { height: 100%; width: 0%; background: var(--green); transition: width 0.3s ease, background 0.3s ease; }

    /* Controls Grid */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; width: 100%; }
    .grid-btns { display: flex; gap: 8px; width: 100%; }
    
    /* Toggle Switch */
    .switch-row { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 8px 0; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #21262d; transition: .2s; border-radius: 24px; border: 1px solid var(--border); }
    .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 3px; bottom: 3px; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider { background-color: var(--accent); }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Config Controls */
    .config-group { display: flex; flex-direction: column; gap: 8px; width: 100%; margin-top: 8px; font-size: 12px; }
    .config-row { display: flex; justify-content: space-between; align-items: center; }
    .mini-btn { background: #21262d; border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 4px; font-weight: bold; cursor: pointer; }

    #errorBox { display: none; background: rgba(218, 54, 51, 0.2); border: 1px solid var(--red); color: #ff7b72; padding: 12px; border-radius: 8px; width: 100%; font-size: 13px; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <!-- Header / Connection -->
  <div class="card">
    <div class="status-bar">
      <div><span id="statusDot" class="dot"></span><span id="statusText">Disconnected</span></div>
      <div id="battMsg" style="font-size: 12px; color: var(--text-muted);">--</div>
    </div>
  </div>

  <div id="errorBox"></div>

  <!-- Connect View -->
  <div id="connectView" class="card">
    <button id="connectBtn" class="btn btn-primary">Connect Vehicle</button>
  </div>

  <!-- Main Control View -->
  <div id="controlView" class="card" style="display: none; gap: 16px;">
    
    <!-- Battery Level -->
    <div class="batt-container">
      <div class="batt-header">
        <span>Battery</span>
        <span id="battVolts">--.-V</span>
      </div>
      <div class="batt-track">
        <div id="battFill" class="batt-fill"></div>
      </div>
    </div>

    <!-- Speed Gauge -->
    <div class="gauge-container">
      <svg id="gaugeSvg" viewBox="0 0 320 200"></svg>
      <div class="gauge-readout">
        <div id="gaugeValue" class="gauge-val">0%</div>
        <div id="gaugeVolts" class="gauge-sub">≈0.0V</div>
      </div>
    </div>

    <!-- Direct Gauge Nudge -->
    <div class="grid-btns">
      <button id="decBtn" class="btn">-5%</button>
      <button id="incBtn" class="btn">+5%</button>
    </div>

    <!-- Start / Stop -->
    <div class="grid-2">
      <button id="startBtn" class="btn btn-primary">START</button>
      <button id="stopBtn" class="btn btn-stop">STOP</button>
    </div>

    <!-- Turbo Panel -->
    <div style="width: 100%; border-top: 1px solid var(--border); padding-top: 12px;">
      <div class="switch-row">
        <span style="font-weight: 600;">Turbo Lock</span>
        <label class="switch">
          <input type="checkbox" id="turboToggle">
          <span class="slider"></span>
        </label>
      </div>
      <button id="turboBtn" class="hold-btn" style="margin-top: 8px;">HOLD FOR TURBO</button>
    </div>

    <!-- Drift Panel -->
    <div style="width: 100%; border-top: 1px solid var(--border); padding-top: 12px;">
      <div class="switch-row">
        <span style="font-weight: 600;">Drift Pulse Lock</span>
        <label class="switch">
          <input type="checkbox" id="driftToggle">
          <span class="slider"></span>
        </label>
      </div>
      <button id="driftBtn" class="hold-btn drift-mode" style="margin-top: 8px;">HOLD FOR DRIFT</button>

      <!-- Drift Tuning -->
      <div class="config-group">
        <div class="config-row">
          <span>Pulse ON Time: <strong id="onMsVal">150</strong>ms</span>
          <div>
            <button class="mini-btn" data-adj="onMs" data-delta="-25">-</button>
            <button class="mini-btn" data-adj="onMs" data-delta="25">+</button>
          </div>
        </div>
        <div class="config-row">
          <span>Pulse OFF Time: <strong id="offMsVal">150</strong>ms</span>
          <div>
            <button class="mini-btn" data-adj="offMs" data-delta="-25">-</button>
            <button class="mini-btn" data-adj="offMs" data-delta="25">+</button>
          </div>
        </div>
        <div class="config-row">
          <span>ON Power: <strong id="onPctVal">100</strong>%</span>
          <div>
            <button class="mini-btn" data-adj="onPct" data-delta="-5">-</button>
            <button class="mini-btn" data-adj="onPct" data-delta="5">+</button>
          </div>
        </div>
        <div class="config-row">
          <span>OFF Power: <strong id="offPctVal">80</strong>%</span>
          <div>
            <button class="mini-btn" data-adj="offPct" data-delta="-5">-</button>
            <button class="mini-btn" data-adj="offPct" data-delta="5">+</button>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
// BLE Config
const DEVICE_NAME       = "PowerWheels-Ctrl";
const SERVICE_UUID      = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
const SPEED_CHAR_UUID   = "6e400002-b5a3-f393-e0a9-e50e24dcca9e";
const RUN_CHAR_UUID     = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const STATUS_CHAR_UUID  = "6e400004-b5a3-f393-e0a9-e50e24dcca9e";
const TURBO_CHAR_UUID   = "6e400005-b5a3-f393-e0a9-e50e24dcca9e";
const DRIFT_CHAR_UUID   = "6e400006-b5a3-f393-e0a9-e50e24dcca9e";
const DRIFT_CONFIG_UUID = "6e400007-b5a3-f393-e0a9-e50e24dcca9e";

const GAUGE_MAX = 150;
const BATTERY_V = 18.0;
const REFRESH_MS = 150; 
const BATT_BAR_MIN = 14.0, BATT_BAR_MAX = 21.0;

let bleDevice, speedChar, runChar, statusChar, turboChar, driftChar, driftConfigChar;
let gaugePercent = 0, running = false;
let lastLocalActionMs = 0;
const LOCAL_ACTION_GRACE_MS = 1200;

let turboSources = { toggle: false, button: false };
let driftSources = { toggle: false, button: false };
let turboActiveConfirmed = false, driftActiveConfirmed = false;
let turboRefreshTimer = null, driftRefreshTimer = null;

let driftConfig = { onMs: 150, offMs: 150, onPct: 100, offPct: 80 };

// Queue BLE writes to prevent GATT overload
let bleQueue = Promise.resolve();
function enqueueWrite(characteristic, payload) {
  if (!characteristic) return Promise.resolve();
  bleQueue = bleQueue.then(async () => {
    try {
      await characteristic.writeValue(payload);
    } catch (err) {
      console.warn("BLE Write error:", err);
    }
  }).catch(() => {});
  return bleQueue;
}

const el = (id) => document.getElementById(id);
const connectView = el('connectView'), controlView = el('controlView');
const statusDot = el('statusDot'), statusText = el('statusText'), errorBox = el('errorBox');
const gaugeValue = el('gaugeValue'), gaugeVolts = el('gaugeVolts');
const startBtn = el('startBtn');
const turboBtn = el('turboBtn'), turboToggle = el('turboToggle');
const driftBtn = el('driftBtn'), driftToggle = el('driftToggle');
const battVolts = el('battVolts'), battFill = el('battFill'), battMsg = el('battMsg');

function calculateVoltage(percent) {
  return (percent / 100.0) * BATTERY_V;
}

// Gauge SVG Rendering
const NORMAL_STEPS = 20, TURBO_STEPS = 10;
function polar(cx, cy, r, angleDeg) { const a = (angleDeg - 180) * Math.PI / 180; return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) }; }
function pctToAngle(pct) { return (pct / GAUGE_MAX) * 180; }

function buildGauge() {
  const svg = el('gaugeSvg'); const cx = 160, cy = 175, rOuter = 140;
  let html = '';
  const nS = polar(cx, cy, rOuter, 0), nE = polar(cx, cy, rOuter, pctToAngle(100));
  html += `<path d="M ${nS.x} ${nS.y} A ${rOuter} ${rOuter} 0 0 1 ${nE.x} ${nE.y}" stroke="#21262c" stroke-width="14" fill="none"/>`;
  const tE = polar(cx, cy, rOuter, 180);
  html += `<path d="M ${nE.x} ${nE.y} A ${rOuter} ${rOuter} 0 0 1 ${tE.x} ${tE.y}" stroke="#3a1418" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  for (let i = 0; i <= NORMAL_STEPS + TURBO_STEPS; i++) {
    const pct = i * 5, angle = pctToAngle(pct);
    const p1 = polar(cx, cy, rOuter + 10, angle), p2 = polar(cx, cy, rOuter + (pct % 25 === 0 ? -2 : 4), angle);
    const major = pct % 25 === 0, inTurbo = pct > 100;
    html += `<line x1="${p1.x}" y1="${p1.y}" x2="${p2.x}" y2="${p2.y}" stroke="${major ? (inTurbo ? '#e63946' : '#8b95a1') : (inTurbo ? '#5a2228' : '#3a4048')}" stroke-width="${major ? 2 : 1}"/>`;
  }
  html += `<path id="gaugeProgress" d="" stroke-width="14" fill="none" stroke-linecap="round"/>`;
  html += `<line id="gaugeNeedle" x1="${cx}" y1="${cy}" x2="${cx}" y2="${cy - 128}" stroke="#ff8a3d" stroke-width="3"/>`;
  html += `<circle cx="${cx}" cy="${cy}" r="6" fill="#ff8a3d"/>`;
  svg.innerHTML = html;
  svg.dataset.cx = cx; svg.dataset.cy = cy; svg.dataset.rOuter = rOuter;
}

function updateGauge(percent, turboOn, driftOn) {
  const svg = el('gaugeSvg'); const cx = +svg.dataset.cx, cy = +svg.dataset.cy, rOuter = +svg.dataset.rOuter;
  const angle = pctToAngle(percent);
  const color = driftOn ? '#a78bfa' : (percent > 100 ? '#e63946' : '#ff8a3d');
  const needle = el('gaugeNeedle'); const tip = polar(cx, cy, 128, angle);
  needle.setAttribute('x2', tip.x); needle.setAttribute('y2', tip.y); needle.setAttribute('stroke', color);
  svg.querySelector('circle').setAttribute('fill', color);
  const progress = el('gaugeProgress'); progress.setAttribute('stroke', color);
  if (percent <= 0) { progress.setAttribute('d', ''); }
  else {
    const start = polar(cx, cy, rOuter, 0), end = polar(cx, cy, rOuter, angle);
    progress.setAttribute('d', `M ${start.x} ${start.y} A ${rOuter} ${rOuter} 0 ${angle > 180 ? 1 : 0} 1 ${end.x} ${end.y}`);
  }
  gaugeValue.textContent = percent + '%';
  gaugeValue.classList.toggle('turbo', percent > 100 && !driftOn);
  gaugeValue.classList.toggle('drift', driftOn);
  
  const estV = calculateVoltage(percent);
  gaugeVolts.textContent = driftOn ? 'pulsing' : ('≈' + estV.toFixed(1) + 'V');
}

buildGauge(); 
updateGauge(0, false, false);

function angleFromPointer(evt) {
  const svg = el('gaugeSvg'); const rect = svg.getBoundingClientRect();
  const cx = rect.left + rect.width * (160/320), cy = rect.top + rect.height * (175/200);
  const px = (evt.touches ? evt.touches[0].clientX : evt.clientX), py = (evt.touches ? evt.touches[0].clientY : evt.clientY);
  let deg = Math.atan2(py - cy, px - cx) * 180 / Math.PI + 180;
  return Math.max(0, Math.min(180, deg));
}
let dragging = false;
el('gaugeSvg').addEventListener('pointerdown', (e) => { dragging = true; handleDrag(e); });
window.addEventListener('pointermove', (e) => { if (dragging) handleDrag(e); });
window.addEventListener('pointerup', () => { dragging = false; });
function handleDrag(e) { const deg = angleFromPointer(e); setGauge(Math.round((deg / 180) * GAUGE_MAX / 5) * 5); }
function setGauge(pct) { gaugePercent = Math.max(0, Math.min(GAUGE_MAX, pct)); lastLocalActionMs = Date.now(); updateGauge(gaugePercent, turboActiveConfirmed, driftActiveConfirmed); sendSpeed(); }
el('incBtn').addEventListener('click', () => setGauge(gaugePercent + 5));
el('decBtn').addEventListener('click', () => setGauge(gaugePercent - 5));

function updateBatteryUI(volts, lowFlag, cutoffFlag) {
  battVolts.textContent = volts.toFixed(1) + 'V';
  const pct = Math.max(0, Math.min(100, ((volts - BATT_BAR_MIN) / (BATT_BAR_MAX - BATT_BAR_MIN)) * 100));
  battFill.style.width = pct + '%';
  if (cutoffFlag) { battFill.style.background = 'var(--red)'; battMsg.textContent = 'CRITICAL — stopped to protect pack'; battMsg.style.color = 'var(--red)'; }
  else if (lowFlag) { battFill.style.background = 'var(--amber)'; battMsg.textContent = 'LOW — turbo & drift locked out'; battMsg.style.color = 'var(--amber)'; }
  else { battFill.style.background = 'var(--green)'; battMsg.textContent = 'OK'; battMsg.style.color = 'var(--text-muted)'; }

  turboBtn.disabled = !running || lowFlag;
  turboToggle.disabled = !running || lowFlag;
  driftBtn.disabled = !running || lowFlag;
  driftToggle.disabled = !running || lowFlag;
}

function refreshDriftConfigUI() {
  el('onMsVal').textContent = driftConfig.onMs;
  el('offMsVal').textContent = driftConfig.offMs;
  el('onPctVal').textContent = driftConfig.onPct;
  el('offPctVal').textContent = driftConfig.offPct;
}

document.querySelectorAll('.mini-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    const key = btn.dataset.adj;
    const delta = parseInt(btn.dataset.delta, 10);
    if (key === 'onMs' || key === 'offMs') {
      driftConfig[key] = Math.max(25, Math.min(1000, driftConfig[key] + delta));
    } else if (key === 'onPct' || key === 'offPct') {
      driftConfig[key] = Math.max(0, Math.min(150, driftConfig[key] + delta));
    }
    refreshDriftConfigUI();
    sendDriftConfig();
  });
});

function evaluateTurbo() {
  const desired = turboSources.toggle || turboSources.button;
  if (desired) {
    if (!turboRefreshTimer) {
      sendTurbo(true);
      turboRefreshTimer = setInterval(function() { sendTurbo(true); }, REFRESH_MS);
    }
  } else {
    if (turboRefreshTimer) { clearInterval(turboRefreshTimer); turboRefreshTimer = null; }
    sendTurbo(false);
  }
}

function evaluateDrift() {
  const desired = driftSources.toggle || driftSources.button;
  if (desired) {
    if (!driftRefreshTimer) {
      sendDrift(true);
      driftRefreshTimer = setInterval(function() { sendDrift(true); }, REFRESH_MS);
    }
  } else {
    if (driftRefreshTimer) { clearInterval(driftRefreshTimer); driftRefreshTimer = null; }
    sendDrift(false);
  }
}

turboToggle.addEventListener('change', function(e) { turboSources.toggle = e.target.checked; evaluateTurbo(); });
['pointerdown', 'touchstart'].forEach(function(evt) {
  turboBtn.addEventListener(evt, function(e) { e.preventDefault(); turboSources.button = true; turboBtn.classList.add('engaged'); evaluateTurbo(); });
});
['pointerup', 'pointercancel', 'touchend'].forEach(function(evt) {
  turboBtn.addEventListener(evt, function(e) { e.preventDefault(); turboSources.button = false; turboBtn.classList.remove('engaged'); evaluateTurbo(); });
});

driftToggle.addEventListener('change', function(e) { driftSources.toggle = e.target.checked; evaluateDrift(); });
['pointerdown', 'touchstart'].forEach(function(evt) {
  driftBtn.addEventListener(evt, function(e) { e.preventDefault(); driftSources.button = true; driftBtn.classList.add('engaged'); evaluateDrift(); });
});
['pointerup', 'pointercancel', 'touchend'].forEach(function(evt) {
  driftBtn.addEventListener(evt, function(e) { e.preventDefault(); driftSources.button = false; driftBtn.classList.remove('engaged'); evaluateDrift(); });
});

function sendSpeed() { lastLocalActionMs = Date.now(); return enqueueWrite(speedChar, new Uint8Array([gaugePercent])); }
function sendRun(st) { lastLocalActionMs = Date.now(); return enqueueWrite(runChar, new Uint8Array([st ? 1 : 0])); }
function sendTurbo(st) { lastLocalActionMs = Date.now(); return enqueueWrite(turboChar, new Uint8Array([st ? 1 : 0])); }
function sendDrift(st) { lastLocalActionMs = Date.now(); return enqueueWrite(driftChar, new Uint8Array([st ? 1 : 0])); }
function sendDriftConfig() {
  const buf = new ArrayBuffer(6); const view = new DataView(buf);
  view.setUint16(0, driftConfig.onMs, true); view.setUint16(2, driftConfig.offMs, true);
  view.setUint8(4, driftConfig.onPct); view.setUint8(5, driftConfig.offPct);
  return enqueueWrite(driftConfigChar, buf);
}

startBtn.addEventListener('click', function() { 
  running = !running; 
  sendRun(running); 
  startBtn.textContent = running ? 'RUNNING' : 'START'; 
  startBtn.classList.toggle('active', running); 
});

el('stopBtn').addEventListener('click', function() { 
  running = false; 
  sendRun(false); 
  startBtn.textContent = 'START'; 
  startBtn.classList.remove('active'); 
});

el('connectBtn').addEventListener('click', async function() {
  errorBox.style.display = 'none';

  if (!navigator.bluetooth) {
    errorBox.textContent = "Web Bluetooth is not supported in this browser context.";
    errorBox.style.display = 'block';
    return;
  }

  try {
    statusText.textContent = "Searching...";
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ name: DEVICE_NAME }],
      optionalServices: [SERVICE_UUID]
    });

    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
    statusText.textContent = "Connecting...";

    const server = await bleDevice.gatt.connect();
    const service = await server.getPrimaryService(SERVICE_UUID);

    speedChar       = await service.getCharacteristic(SPEED_CHAR_UUID);
    runChar         = await service.getCharacteristic(RUN_CHAR_UUID);
    statusChar      = await service.getCharacteristic(STATUS_CHAR_UUID);
    turboChar       = await service.getCharacteristic(TURBO_CHAR_UUID);
    driftChar       = await service.getCharacteristic(DRIFT_CHAR_UUID);
    driftConfigChar = await service.getCharacteristic(DRIFT_CONFIG_UUID);

    await statusChar.startNotifications();
    statusChar.addEventListener('characteristicvaluechanged', handleStatusNotification);

    statusDot.classList.add('connected');
    statusText.textContent = "Connected";
    connectView.style.display = 'none';
    controlView.style.display = 'flex';
  } catch (err) {
    statusText.textContent = "Disconnected";
    errorBox.textContent = "Bluetooth Error: " + (err.message || err);
    errorBox.style.display = 'block';
  }
});

function onDisconnected() {
  statusDot.classList.remove('connected');
  statusText.textContent = "Disconnected";
  connectView.style.display = 'flex';
  controlView.style.display = 'none';
  if (turboRefreshTimer) clearInterval(turboRefreshTimer);
  if (driftRefreshTimer) clearInterval(driftRefreshTimer);
}

function handleStatusNotification(evt) {
  const view = evt.target.value;
  if (!view || view.byteLength === 0) return;

  running = view.getUint8(0) === 1;
  
  if (view.byteLength >= 2) {
    const speed = view.getUint8(1);
    if (Date.now() - lastLocalActionMs >= LOCAL_ACTION_GRACE_MS) {
      gaugePercent = speed;
      updateGauge(gaugePercent, turboActiveConfirmed, driftActiveConfirmed);
    }
  }

  if (view.byteLength >= 3) turboActiveConfirmed = view.getUint8(2) === 1;
  if (view.byteLength >= 4) driftActiveConfirmed = view.getUint8(3) === 1;

  let volts = 18.0;
  if (view.byteLength >= 6) {
    const raw = view.getUint16(4, true);
    volts = raw > 100 ? raw / 100.0 : raw;
  }
  
  const flags = view.byteLength >= 7 ? view.getUint8(6) : 0;

  startBtn.textContent = running ? 'RUNNING' : 'START';
  startBtn.classList.toggle('active', running);
  updateBatteryUI(volts, (flags & 1) !== 0, (flags & 2) !== 0);
}
</script>

</body>
</html>
